<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#08090a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="bg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Memory-grid mark (48-unit artwork scaled ×3, visible cells span 7..41) -->
  <g transform="translate(431,228) scale(3)" fill="#ffffff">
    <rect x="7"  y="7"  width="7" height="7" rx="1.5" opacity="0.26"/>
    <rect x="16" y="7"  width="7" height="7" rx="1.5" opacity="0.5"/>
    <rect x="25" y="7"  width="7" height="7" rx="1.5" opacity="0.82"/>
    <rect x="34" y="7"  width="7" height="7" rx="1.5" opacity="1"/>
    <rect x="7"  y="16" width="7" height="7" rx="1.5" opacity="0.18"/>
    <rect x="16" y="16" width="7" height="7" rx="1.5" opacity="0.34"/>
    <rect x="25" y="16" width="7" height="7" rx="1.5" opacity="0.66"/>
    <rect x="34" y="16" width="7" height="7" rx="1.5" opacity="0.9"/>
    <rect x="7"  y="25" width="7" height="7" rx="1.5" opacity="0.14"/>
    <rect x="16" y="25" width="7" height="7" rx="1.5" opacity="0.22"/>
    <rect x="25" y="25" width="7" height="7" rx="1.5" opacity="0.42"/>
    <rect x="34" y="25" width="7" height="7" rx="1.5" opacity="0.58"/>
    <rect x="7"  y="34" width="7" height="7" rx="1.5" opacity="0.12"/>
    <rect x="16" y="34" width="7" height="7" rx="1.5" opacity="0.15"/>
    <rect x="25" y="34" width="7" height="7" rx="1.5" opacity="0.22"/>
    <rect x="34" y="34" width="7" height="7" rx="1.5" opacity="0.3"/>
  </g>

  <!-- Wordmark "Rift" -->
  <text x="596" y="333" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="600" letter-spacing="-4" fill="#f7f8f8">Rift</text>

  <!-- Tagline -->
  <text x="600" y="410" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="white" text-anchor="middle" opacity="0.42">Local-first memory for AI tools</text>
</svg>
