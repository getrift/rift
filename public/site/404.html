<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Onadit</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Cg transform='translate(4 4)' fill='%23EDEDED'%3E%3Cpath d='M5 3h8.2L9.4 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z'/%3E%3Cpath fill-rule='evenodd' d='M15.2 3H19a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7.6ZM16.82 5L13.87 19H19V5Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<script>
// The theme: dark, unless the reader chose light. Runs in the head, before the first paint.
(() => {
  const root = document.documentElement;
  const stored = () => { try { return localStorage.getItem('onadit-theme') === 'light'; } catch { return false; } };
  const asked = new URLSearchParams(location.search).get('theme');
  let light = asked === 'light' || (asked !== 'dark' && stored()), fading = 0;
  const apply = () => {
    if (light) root.dataset.theme = 'light'; else delete root.dataset.theme;
    // the 404 page sits inside the site's own layout, which has no such tag
    const tint = document.querySelector('meta[name="theme-color"]');
    if (tint) tint.content = light ? '#FFFFFF' : '#0A0A0A';
    const button = document.querySelector('.theme'), label = `Switch to ${light ? 'dark' : 'light'} theme`;
    if (button) { button.setAttribute('aria-label', label); button.title = label; }
  };
  root.classList.add('js');
  apply();
  document.addEventListener('DOMContentLoaded', apply);
  // another tab, or a page brought back by the Back button, picks up the latest choice
  addEventListener('storage', () => { light = stored(); apply(); });
  addEventListener('pageshow', e => { if (e.persisted) { light = stored(); apply(); } });
  document.addEventListener('click', e => {
    if (!e.target.closest('.theme')) return;
    light = !light;
    try { if (light) localStorage.setItem('onadit-theme', 'light'); else localStorage.removeItem('onadit-theme'); } catch {}
    root.classList.add('theming'); clearTimeout(fading); fading = setTimeout(() => root.classList.remove('theming'), 420);
    apply();
  });
})();
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0A0A0A; --fg: #EDEDED; --txt: #B4B4B4; --dim: #8A8A8A; --line: #1F1F1F; --dash: #343434; --panel: #131314;
  /* the drawing lines and their crosses. Black, white and grey only: no hue anywhere */
  --rule: rgba(255, 255, 255, .09); --cross: #5C5C5C;
  --e: cubic-bezier(.23, 1, .32, 1);
  /* Berkeley Mono is the intended face for code and small metadata; Geist Mono stands in until its webfont is here */
  --mono: "Berkeley Mono", "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #FFFFFF; --fg: #111111; --txt: #3D3D3D; --dim: #767676; --line: #E8E8E8; --dash: #D2D2D2; --panel: #F6F6F7;
  --rule: rgba(0, 0, 0, .09); --cross: #A3A3A3;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 88px; }
body {
  margin: 0; background: var(--bg); color: var(--txt);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  font-optical-sizing: auto; font-size: 16px; line-height: 28px;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
.theming, .theming *, .theming *::before, .theming *::after { transition: background-color .32s ease, color .32s ease, border-color .32s ease !important; }
h1, h2, h3, p, ul, ol, pre { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
::selection { background: var(--fg); color: var(--bg); }
:root :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
/* the theme button shows the theme you are in: a moon in dark, a sun in light */
.theme svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun, [data-theme="light"] .theme .moon { display: none; }
[data-theme="light"] .theme .sun { display: block; }
.meta { font: 400 12.5px/20px var(--mono); color: var(--dim); }
body { display: flex; flex-direction: column; min-height: 100svh; overflow-x: clip; }
.bar, footer { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px clamp(20px, 4vw, 48px); font-size: 14px; color: var(--dim); }
.bar a.brand { display: flex; align-items: center; gap: 9px; color: var(--fg); font-weight: 500; }
.bar svg { width: 18px; height: 18px; }
footer nav { display: flex; align-items: center; gap: 24px; }
.bar a:hover, footer a:hover, .theme:hover { color: var(--fg); }
.theme { all: unset; cursor: pointer; display: flex; padding: 8px; margin: -8px; border-radius: 8px; }
.theme svg { width: 16px; height: 16px; }

/* the drawing sheet: two verticals the full height, and horizontals that run off both edges */
main { flex: 1; display: flex; border-block: 1px solid var(--rule); }
.sheet { position: relative; display: flex; flex-direction: column; justify-content: center; width: min(1040px, 100% - 48px); margin: 0 auto; border-inline: 1px solid var(--rule); }
.plate { position: relative; padding: clamp(48px, 9vh, 104px) clamp(20px, 5vw, 72px); text-align: center; }
.plate::before, .plate::after { content: ""; position: absolute; left: calc(50% - 50vw); width: 100vw; border-top: 1px solid var(--rule); }
.plate::before { top: 0; }
.plate::after { bottom: 0; }
.acts { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 28px 20px; }
.acts::after { content: ""; position: absolute; left: calc(50% - 50vw); bottom: 0; width: 100vw; border-top: 1px solid var(--rule); }
/* a small cross where the lines meet. Its 2 strokes lie on the 1px lines: whole-pixel offsets only, a half pixel puts it beside them */
.x { position: absolute; width: 11px; height: 11px; margin: -6px; background: linear-gradient(var(--cross), var(--cross)) 50% 50% / 11px 1px no-repeat, linear-gradient(var(--cross), var(--cross)) 50% 50% / 1px 11px no-repeat; }
.x.tl { top: 1px; left: 0; } .x.tr { top: 1px; right: 0; } .x.bl { bottom: 1px; left: 0; } .x.br { bottom: 1px; right: 0; }

/* the sentence is grey; only the words that carry it are bright. A dotted line under a bright phrase says it explains itself */
h1 { font-size: clamp(28px, 3.3vw, 48px); font-weight: 500; line-height: 1.1; letter-spacing: -.035em; color: var(--dim); max-width: 24ch; margin: 0 auto; text-wrap: balance; }
h1 em, h1 i, h1 b { font-style: normal; font-weight: inherit; color: var(--fg); }
/* 2 paragraphs in 1 headline: what it is, then how it feels */
h1 > span { display: block; }
h1 > span + span { margin-top: .55em; }
.plate > .meta { margin-bottom: 18px; }
/* the dots are a background, not an underline, so they can drift slowly to the right. They sit where the underline sat (Inter's descent is .24em).
   A text shadow in the page colour opens a gap around descenders, as the underline did */
@property --ink { syntax: "<color>"; inherits: false; initial-value: #8A8A8A; }
h1 em { --dot: max(1px, round(.045em, 1px)); --ink: var(--dim); cursor: default; border-radius: 6px; background: linear-gradient(90deg, var(--ink) 50%, transparent 0) 0 calc(100% - .126em) / calc(var(--dot) * 2) var(--dot) repeat-x; text-shadow: .03em 0 var(--bg), -.03em 0 var(--bg), .06em 0 var(--bg), -.06em 0 var(--bg); animation: drift 1.4s linear infinite; transition: --ink .2s var(--e); }
h1 em:hover, h1 em:focus { --ink: var(--fg); }
@keyframes drift { to { background-position-x: calc(var(--dot) * 2); } }
/* while a phrase shows its card, the rest of the page steps back under a veil in the page colour. The phrase and its card sit above it */
body::after { content: ""; position: fixed; inset: 0; z-index: 5; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .25s var(--e); }
body.lens::after { opacity: .45; }
h1 em.shown { position: relative; z-index: 7; }
/* the words are said, not shown: the script times each one (--d), at the pace of speech with a pause at each comma and full stop.
   A word comes out of a faint blur. A bright phrase arrives grey like the rest and lights up once it has been said, then its dots come in */
.js .read:not(.split) { visibility: hidden; }
.js .read .w { animation: said .7s var(--e) var(--d) backwards; }
.js h1.read em { animation: drift 1.4s linear infinite, lit .9s var(--e) var(--d) backwards; }
.js h1.read b { animation: lit .9s var(--e) var(--d) backwards; }
@keyframes said { from { opacity: .1; filter: blur(6px); } }
@keyframes lit { from { color: var(--dim); --ink: transparent; } }
/* the explanation: a small card under the phrase, placed by the script so it never leaves the window. It sits above the buttons */
.tip { position: absolute; z-index: 6; top: 0; left: 0; width: min(320px, 100vw - 24px); padding: 12px 14px 13px; border: 1px solid var(--dash); border-radius: 10px; background: var(--panel); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .5); font-size: 14px; line-height: 21px; text-align: left; color: var(--txt); pointer-events: none; transform-origin: 50% 0; opacity: 0; visibility: hidden; scale: .97; translate: 0 -4px; filter: blur(4px); transition: opacity .14s ease-in, scale .14s ease-in, translate .14s ease-in, filter .14s ease-in, visibility 0s .14s; }
.tip.on { opacity: 1; visibility: visible; scale: 1; translate: 0 0; filter: blur(0); transition: opacity .22s var(--e), scale .22s var(--e), translate .22s var(--e), filter .22s var(--e), visibility 0s; }
.tip b { display: block; margin-bottom: 3px; font-weight: 500; color: var(--fg); }
.tip b:not(:first-child) { margin-top: 10px; }
.apps { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; margin: 9px 0 11px; color: var(--fg); }
.apps span { display: flex; align-items: center; gap: 8px; }
.apps svg { flex: none; width: 16px; height: 16px; }
.apps .more { grid-column: 1 / -1; color: var(--txt); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 46px; padding: 0 24px; border-radius: 999px; white-space: nowrap; font-size: 15px; font-weight: 500; border: 1px solid var(--fg); color: var(--fg); background: var(--bg); transition: transform .2s var(--e); }
.btn.go { background: var(--fg); color: var(--bg); min-width: 236px; }
.btn:active { transform: scale(.96); }
.btn svg { width: 16px; height: 16px; margin-top: -3px; }
/* the second button opens a short menu: hand the brief to an agent, or read the docs. It opens upwards when there is no room below */
.ask { position: relative; z-index: 4; display: flex; }
.ask .btn { flex: 1; }
.btn .caret { width: 10px; height: 10px; margin: 1px -2px 0 0; transition: rotate .2s var(--e); }
.ask [aria-expanded="true"] .caret { rotate: 180deg; }
.menu { position: absolute; left: 50%; top: calc(100% + 10px); width: 272px; margin-left: -136px; padding: 6px; border: 1px solid var(--dash); border-radius: 12px; background: var(--panel); box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .5); font-size: 14px; line-height: 20px; text-align: left; }
.menu.up { top: auto; bottom: calc(100% + 10px); }
.menu p { padding: 6px 10px 4px; font-size: 12px; color: var(--dim); }
.menu p:not(:first-child) { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.menu a, .menu button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border-radius: 6px; white-space: nowrap; color: var(--fg); }
.menu a:hover, .menu button:hover, .menu a:focus-visible, .menu button:focus-visible { background: var(--line); }
/* how it opens: the card grows out of the button, then its rows arrive one after the other, nearest the button first.
   It closes faster than it opens, all at once. These are transitions, so a second click half-way simply turns it around */
.menu { transform-origin: 50% 0; opacity: 0; visibility: hidden; scale: .96; translate: 0 -6px; filter: blur(4px); transition: opacity .15s ease-in, scale .15s ease-in, translate .15s ease-in, filter .15s ease-in, visibility 0s .15s; }
.menu.up { transform-origin: 50% 100%; translate: 0 6px; }
.menu.open { opacity: 1; visibility: visible; scale: 1; translate: 0 0; filter: blur(0); transition: opacity .24s var(--e), scale .24s var(--e), translate .24s var(--e), filter .24s var(--e), visibility 0s; }
.menu > p, .menu > a, .menu > button { opacity: 0; translate: 0 -6px; transition: opacity .12s ease-in, translate .12s ease-in, background-color .12s ease; }
.menu.up > p, .menu.up > a, .menu.up > button { translate: 0 6px; }
.menu.open > p, .menu.open > a, .menu.open > button { --wait: calc(var(--i, 0) * 26ms + 30ms); opacity: 1; translate: 0 0; transition: opacity .3s var(--e) var(--wait), translate .3s var(--e) var(--wait), background-color .12s ease; }
.menu.up.open > p, .menu.up.open > a, .menu.up.open > button { --wait: calc((var(--last, 0) - var(--i, 0)) * 26ms + 30ms); }
.menu svg { flex: none; width: 16px; height: 16px; }
.menu small { margin-left: auto; font-size: 12px; color: var(--dim); }

.js .plate > h1:not(.read), .js .acts > * { opacity: 0; transform: translate3d(0, 10px, 0); animation: up .8s var(--e) forwards; }
.js .acts > * { animation-delay: var(--d, .15s); }
@keyframes up { to { opacity: 1; transform: none; } }

@media (max-width: 640px) {
  .acts { flex-direction: column; align-items: stretch; padding: 22px 20px; }
  .btn.go { min-width: 0; }
  .menu { left: 0; right: 0; width: auto; margin-left: 0; }
  footer { flex-direction: column; align-items: flex-start; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { .js .plate > *, .js .acts > * { animation: none; opacity: 1; transform: none; } h1 em, .js h1.read em, .js h1.read b, .js .read .w { animation: none; } body::after { transition: none; } .theming, .theming *, .tip, .menu, .menu > * { transition: none !important; } }
</style>
