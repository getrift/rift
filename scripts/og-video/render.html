<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400&display=block");
  html, body { margin: 0; background: #08090a; }
</style>
</head>
<body>
<canvas id="out"></canvas>
<script>
/* onadit.com og:video (public/og.mp4). The home page's sphere (app/sphere-field.tsx at 9233a56),
   run without a pointer on a fixed clock: the cloud turns and breathes, then one
   retrieval plays (select → assemble → hold → release) and the cloud settles.
   1200 x 630 like public/og.png, with its wordmark and line. The last second is
   cross-faded into the first so the clip loops without a jump.
   Query string: ?still=<seconds> renders that one moment and posts it as a PNG. */
const W = 1200, H = 630, DPR = 2, FPS = 30, SUB = 2;   // 60 Hz physics, like the site
const LOOP = 7.5, FADE = 1.0, Q_AT = 1.6;              // loop length, cross-fade, retrieval start
const params = new URLSearchParams(location.search);
// the two departures from the site, so the gathered memories read at preview size:
const DIM = Number(params.get("dim") ?? 0.5);          // site: 0.3, how far the rest of the cloud recedes
const NODE_SIZE = Number(params.get("node") ?? 1.3);   // site: 1, size of the gathered particles

let s = 20261021;                                        // seeded: same clip every run
const rand = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const out = document.getElementById("out");
out.width = W; out.height = H;
const octx = out.getContext("2d", { willReadFrequently: true });
const layer = document.createElement("canvas");
layer.width = W * DPR; layer.height = H * DPR;
const ctx = layer.getContext("2d");
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const TAU = Math.PI * 2, GOLDEN = Math.PI * (3 - Math.sqrt(5)), TILT = -0.4;
const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
const BASE_A = 0.1, DEPTH_A = 0.4, BUCKETS = 12, AMAX = 1.0, DEPTH_BUCKETS = 6;
const T_SELECT = 0.5, T_ASSEMBLE = 0.9, T_HOLD = 2.8, T_RELEASE = 1.1;
const s1 = T_SELECT, s2 = s1 + T_ASSEMBLE, s3 = s2 + T_HOLD, s4 = s3 + T_RELEASE;

const DOT = document.createElement("canvas");
DOT.width = DOT.height = 24;
{ const d = DOT.getContext("2d"), g = d.createRadialGradient(12, 12, 0, 12, 12, 12);
  g.addColorStop(0, "rgba(240,243,247,1)"); g.addColorStop(0.55, "rgba(240,243,247,0.9)");
  g.addColorStop(1, "rgba(240,243,247,0)"); d.fillStyle = g; d.beginPath(); d.arc(12, 12, 12, 0, TAU); d.fill(); }

const cx = W * 0.66, cy = H * 0.42, R = Math.min(W, H) * 0.46;
const n = Math.max(18000, Math.min(34000, Math.round(R * R * 0.62)));
const K = Math.max(36, Math.round(n / 420));
const bx = new Float32Array(n), by = new Float32Array(n), bz = new Float32Array(n);
const phase = new Float32Array(n), seed = new Float32Array(n), topic = new Uint16Array(n);
const ox = new Float32Array(n), oy = new Float32Array(n), vx = new Float32Array(n), vy = new Float32Array(n);
const sx = new Float32Array(n), sy = new Float32Array(n), dp = new Float32Array(n);
const slot = new Int32Array(n), bk = new Int8Array(n), mt = new Float32Array(n), nodeList = new Int32Array(n);
for (let i = 0; i < n; i++) {
  const u = rand() * 2 - 1, th = rand() * TAU, rr = Math.sqrt(Math.max(0, 1 - u * u));
  const rad = rand() < 0.5 ? 0.76 + rand() * 0.32 : Math.cbrt(rand()) * 0.95;
  bx[i] = rr * Math.cos(th) * rad; by[i] = u * rad; bz[i] = rr * Math.sin(th) * rad;
  phase[i] = rand() * TAU; seed[i] = 0.5 + rand() * 1.0; topic[i] = Math.floor(rand() * K); slot[i] = -1;
}

let qActive = false, qStart = 0, selCount = 1, qDone = false;
const qx = cx, qy = cy;
const MAX_ARCS = 14, arcA = new Int32Array(MAX_ARCS).fill(-1), arcB = new Int32Array(MAX_ARCS);
const arcBorn = new Float32Array(MAX_ARCS), arcJit = new Float32Array(MAX_ARCS);
let arcAcc = 0, ay = 0;
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function startRetrieval(t) {
  const tp = Math.floor(rand() * K); let count = 0;
  for (let i = 0; i < n; i++) slot[i] = topic[i] === tp ? count++ : -1;
  selCount = Math.max(1, count);
  for (let k = 0; k < MAX_ARCS; k++) arcA[k] = -1;
  arcAcc = 0; qStart = t; qActive = true;
}

/* One physics step of the site's frame(), pointer terms removed. draw = paint the layer. */
function step(t, dt, draw) {
  ay += dt * 0.05;
  const cosY = Math.cos(ay), sinY = Math.sin(ay);
  if (!qActive && !qDone && t >= Q_AT) startRetrieval(t);
  let assemble = 0, glow = 0;
  if (qActive) {
    const e = t - qStart;
    if (e < s1) { glow = smooth(0, s1 * 0.85, e); }
    else if (e < s2) { assemble = smooth(s1, s2, e); glow = 1; }
    else if (e < s3) { assemble = 1; glow = 1; }
    else if (e < s4) { const r = smooth(s3, s4, e); assemble = 1 - r; glow = 1 - r; }
    else { qActive = false; qDone = true; }
  }
  const nodeSpin = t * 0.12, cosSpin = Math.cos(nodeSpin), sinSpin = Math.sin(nodeSpin);
  const rN = R * 0.17, NODE_DEPTH = 0.24, k = 18, damp = 0.8, dimOthers = DIM * glow;
  let nodeCount = 0;
  for (let i = 0; i < n; i++) {
    const br = 1 + 0.045 * Math.sin(t * 0.45 + phase[i]);
    const X = bx[i] * br, Y = by[i] * br, Z = bz[i] * br;
    const x1 = X * cosY - Z * sinY, z1 = X * sinY + Z * cosY;
    const y2 = Y * cosT - z1 * sinT, z2 = Y * sinT + z1 * cosT;
    const persp = 1 / (1 - z2 * 0.42), sphereDepth = (z2 + 1) * 0.5;
    const homeX = cx + x1 * R * persp, homeY = cy - y2 * R * persp;
    const isSel = slot[i] >= 0;
    let axf, ayf, slotX = 0, slotY = 0, targetDepth = sphereDepth, hasSlot = false;
    if (isSel && assemble > 0) {
      const j = slot[i], yy = 1 - ((j + 0.5) / selCount) * 2, rr2 = Math.sqrt(Math.max(0, 1 - yy * yy));
      const aa = j * GOLDEN, nX = rr2 * Math.cos(aa), nZ0 = rr2 * Math.sin(aa);
      const rx = nX * cosSpin - nZ0 * sinSpin, rz = nX * sinSpin + nZ0 * cosSpin;
      const cpersp = 1 / (1 - rz * 0.18);
      slotX = qx + rx * rN * cpersp; slotY = qy - yy * rN * cpersp;
      targetDepth = 0.5 + NODE_DEPTH * rz; hasSlot = true;
      axf = ((slotX - homeX) * assemble - ox[i]) * k; ayf = ((slotY - homeY) * assemble - oy[i]) * k;
    } else { axf = -ox[i] * k; ayf = -oy[i] * k; }
    vx[i] = (vx[i] + axf * dt) * damp; vy[i] = (vy[i] + ayf * dt) * damp;
    ox[i] += vx[i] * dt; oy[i] += vy[i] * dt;
    const px = homeX + ox[i], py = homeY + oy[i];
    sx[i] = px; sy[i] = py;
    let materialize = 0;
    if (hasSlot) {
      const travel = Math.hypot(slotX - homeX, slotY - homeY), toSlot = Math.hypot(px - slotX, py - slotY);
      materialize = smooth(0.45, 0.92, travel > 1 ? Math.max(0, 1 - toSlot / travel) : 1);
    }
    mt[i] = materialize;
    if (isSel && materialize > 0.5) nodeList[nodeCount++] = i;
    const shadeDepth = sphereDepth + (targetDepth - sphereDepth) * materialize;
    dp[i] = shadeDepth;
    let alpha = (BASE_A + shadeDepth * DEPTH_A) * seed[i];
    if (isSel) alpha = (alpha + glow * (0.05 + 0.4 * sphereDepth)) * (1 - materialize);
    else alpha *= 1 - dimOthers;
    if (alpha > 0.97) alpha = 0.97;
    let q = (alpha / AMAX * BUCKETS) | 0; if (q > BUCKETS - 1) q = BUCKETS - 1;
    bk[i] = q;
  }
  // sparks are spawned every physics step, like the site; drawn only on painted steps
  if (nodeCount > 1) {
    const CD2 = (R * 0.09) * (R * 0.09);
    arcAcc += dt * glow * 9 * (nodeCount / selCount);
    while (arcAcc >= 1) {
      arcAcc -= 1;
      let slotK = -1; for (let kk = 0; kk < MAX_ARCS; kk++) if (arcA[kk] < 0) { slotK = kk; break; }
      if (slotK < 0) break;
      const a = nodeList[(rand() * nodeCount) | 0]; if (dp[a] < 0.5) continue;
      let b = -1;
      for (let tries = 0; tries < 8; tries++) {
        const cand = nodeList[(rand() * nodeCount) | 0];
        if (cand === a || dp[cand] < 0.5 || Math.abs(dp[a] - dp[cand]) > 0.14) continue;
        const ex = sx[a] - sx[cand], ey = sy[a] - sy[cand];
        if (ex * ex + ey * ey < CD2) { b = cand; break; }
      }
      if (b < 0) continue;
      arcA[slotK] = a; arcB[slotK] = b; arcBorn[slotK] = t; arcJit[slotK] = (rand() * 2 - 1) * 0.13;
    }
  }
  if (!draw) return;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (let bkt = 0; bkt < BUCKETS; bkt++) {
    ctx.globalAlpha = ((bkt + 0.5) / BUCKETS) * AMAX;
    for (let i = 0; i < n; i++) {
      if (bk[i] !== bkt) continue;
      const depth = dp[i], s = depth > 0.66 ? 3.8 : depth > 0.33 ? 2.9 : 2.1;
      ctx.drawImage(DOT, sx[i] - s / 2, sy[i] - s / 2, s, s);
    }
  }
  if (assemble > 0) {
    ctx.globalCompositeOperation = "source-over";
    for (let db = 0; db < DEPTH_BUCKETS; db++) {
      for (let i = 0; i < n; i++) {
        if (slot[i] < 0) continue;
        const m = mt[i]; if (m <= 0) continue;
        const depth = dp[i]; let d = (depth * DEPTH_BUCKETS) | 0; if (d > DEPTH_BUCKETS - 1) d = DEPTH_BUCKETS - 1;
        if (d !== db) continue;
        let a = (0.3 + 0.62 * depth) * m; if (a > 0.97) a = 0.97;
        ctx.globalAlpha = a;
        const s = (depth > 0.66 ? 3.4 : depth > 0.33 ? 2.8 : 2.2) * NODE_SIZE;
        ctx.drawImage(DOT, sx[i] - s / 2, sy[i] - s / 2, s, s);
      }
    }
  }
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = "#eef1f5"; ctx.lineWidth = 0.85;
  for (let kk = 0; kk < MAX_ARCS; kk++) {
    if (arcA[kk] < 0) continue;
    const age = t - arcBorn[kk]; if (age > 0.18) { arcA[kk] = -1; continue; }
    const p = age / 0.18, env = p < 0.25 ? p / 0.25 : 1 - (p - 0.25) / 0.75;
    const a = arcA[kk], b = arcB[kk], al = env * 0.5 * (0.35 + 0.85 * Math.min(dp[a], dp[b]));
    if (al <= 0.02) continue;
    const axp = sx[a], ayp = sy[a], bxp = sx[b], byp = sy[b];
    const ex = bxp - axp, ey = byp - ayp, len = Math.hypot(ex, ey) || 1;
    const off = len * arcJit[kk] * (1 + 0.12 * Math.sin(t * 55 + kk));
    ctx.globalAlpha = al; ctx.beginPath();
    ctx.moveTo(axp, ayp); ctx.lineTo((axp + bxp) / 2 - (ey / len) * off, (ayp + byp) / 2 + (ex / len) * off);
    ctx.lineTo(bxp, byp); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

/* The finished picture: canvas colour, the particle layer, then the words of public/og.png. */
function compose() {
  octx.globalAlpha = 1;
  octx.fillStyle = "#08090a"; octx.fillRect(0, 0, W, H);
  octx.imageSmoothingQuality = "high";
  octx.drawImage(layer, 0, 0, W, H);
  octx.fillStyle = "#f7f8f8"; octx.font = "400 55px Geist"; octx.letterSpacing = "-0.04em";
  octx.fillText("onadit", 74, 477);
  octx.fillStyle = "#8a8f98"; octx.font = "400 22px Geist"; octx.letterSpacing = "0px";
  octx.fillText("Local memory all your agents can use.", 74, 542);
  return octx.getImageData(0, 0, W, H);
}

async function post(path, body) { await fetch(path, { method: "POST", body }); }

(async () => {
  await document.fonts.load("400 55px Geist"); await document.fonts.load("400 22px Geist");
  const dt = 1 / (FPS * SUB);
  const still = params.get("still");
  const total = Math.round((LOOP + FADE) * FPS);
  const head = [];                                      // the first FADE seconds, kept for the cross-fade
  for (let f = 0; f < total; f++) {
    for (let sub = 0; sub < SUB; sub++) step((f * SUB + sub) * dt, dt, sub === SUB - 1);
    const t = (f + 1) / FPS;
    if (still !== null) {
      if (t >= Number(still)) { compose(); await post("/still", await new Promise(r => out.toBlob(r, "image/png"))); await post("/done", ""); return; }
      continue;
    }
    const img = compose();
    if (f < FADE * FPS) { head.push(new Uint8ClampedArray(img.data)); continue; }
    if (f >= LOOP * FPS) {                              // blend toward the matching head frame
      const h = head[f - LOOP * FPS], w = (f - LOOP * FPS + 1) / (FADE * FPS), d = img.data;
      for (let i = 0; i < d.length; i++) d[i] = d[i] + (h[i] - d[i]) * w;
    }
    await post("/frame", img.data);
  }
  await post("/done", "");
})();
</script>
</body>
</html>
