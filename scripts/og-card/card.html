<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- onadit.com share card. The home page as a still (public/og.png): the wordmark, the drawing sheet, the first sentence
     grey with the bright phrases dotted, and the download button. With ?play it is the same card in motion (public/og.mp4).
     Colours, type, the mark, the Apple logo and the motion are copied from the engine repo's preview/site-v42 (tokens.css,
     hero.html, build.py). run.sh renders the still, video.mjs the video, both at 1200 x 630 from twice the pixels -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=block" rel="stylesheet">
<style>
  :root { --bg: #0A0A0A; --fg: #EDEDED; --dim: #8A8A8A; --rule: rgba(255, 255, 255, .09); --cross: #5C5C5C; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 13px; height: 92px; padding: 0 56px; font-size: 26px; font-weight: 500; color: var(--fg); }
  header svg { width: 28px; height: 28px; }
  /* the sheet: two verticals to the bottom edge, and horizontals that run off both sides */
  main { flex: 1; display: flex; border-top: 1px solid var(--rule); }
  .sheet { position: relative; display: flex; flex-direction: column; justify-content: center; width: 1008px; margin: 0 auto; border-inline: 1px solid var(--rule); }
  .plate, .acts { position: relative; }
  .plate::before, .plate::after, .acts::after { content: ""; position: absolute; left: -96px; width: 1200px; border-top: 1px solid var(--rule); }
  .plate::before { top: 0; }
  .plate::after, .acts::after { bottom: 0; }
  .plate { padding: 46px 40px 48px; text-align: center; }
  .acts { display: flex; justify-content: center; padding: 30px 0; }
  .x { position: absolute; width: 13px; height: 13px; margin: -7px; background: linear-gradient(var(--cross), var(--cross)) 50% 50% / 13px 1px no-repeat, linear-gradient(var(--cross), var(--cross)) 50% 50% / 1px 13px no-repeat; }
  .x.tl { top: 1px; left: 0; } .x.tr { top: 1px; right: 0; } .x.bl { bottom: 1px; left: 0; } .x.br { bottom: 1px; right: 0; }
  h1 { font-size: 68px; font-weight: 500; line-height: 1.08; letter-spacing: -.04em; color: var(--dim); margin: 0 auto; }
  h1 em, h1 i { font-style: normal; color: var(--fg); }
  /* the dots as the home page draws them, with the same gap around descenders */
  @property --ink { syntax: "<color>"; inherits: false; initial-value: #8A8A8A; }
  h1 em { --dot: round(.045em, 1px); background: linear-gradient(90deg, var(--ink) 50%, transparent 0) 0 calc(100% - .126em) / calc(var(--dot) * 2) var(--dot) repeat-x; text-shadow: .03em 0 var(--bg), -.03em 0 var(--bg), .06em 0 var(--bg), -.06em 0 var(--bg); }
  .btn { display: inline-flex; align-items: center; gap: 12px; height: 62px; padding: 0 32px; border: 1.5px solid var(--fg); border-radius: 999px; font-size: 22px; font-weight: 500; color: var(--fg); }
  .btn svg { width: 22px; height: 22px; margin-top: -4px; }

  /* ?play, an 8.4 s loop (6 turns of the dots). The headline is read out as on the home page: each word rises out of a 4px blur,
     its start (--d) set by its place in the text. A dotted phrase gets its dots once its last word is up, and they drift.
     The button rises once the headline has landed. At 7.2 s it all fades out, softer than it came in, and the loop starts
     again on the empty sheet */
  .play .w { display: inline-block; animation: said .8s cubic-bezier(.23, 1, .32, 1) var(--d) both; }
  .play h1 em { animation: drift 1.4s linear infinite, dots .8s ease var(--d) both; }
  .play .btn { animation: up .8s cubic-bezier(.23, 1, .32, 1) var(--d) both, out .7s ease-in 7.2s forwards; }
  .play h1 { animation: out .7s ease-in 7.2s forwards; }
  @keyframes said { from { opacity: 0; filter: blur(4px); transform: translateY(.25em); } }
  @keyframes dots { from { --ink: transparent; } }
  @keyframes drift { to { background-position-x: calc(var(--dot) * 2); } }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } }
  @keyframes out { to { opacity: 0; filter: blur(4px); } }
</style>
</head>
<body>
<header><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h8.2L9.4 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path fill-rule="evenodd" d="M15.2 3H19a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7.6ZM16.82 5L13.87 19H19V5Z"/></svg>onadit</header>
<main>
  <div class="sheet">
    <section class="plate">
      <i class="x tl"></i><i class="x tr"></i><i class="x bl"></i><i class="x br"></i>
      <h1>A <em>local memory</em><br>that gets better <em>every day</em><i>,</i><br>so <em>your AI agents do too</em><i>.</i></h1>
    </section>
    <div class="acts">
      <i class="x bl"></i><i class="x br"></i>
      <span class="btn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>Download for Mac</span>
    </div>
  </div>
</main>
<script>
// ?play: split the headline into words and time each one, 13 ms per character as on the home page
if (new URLSearchParams(location.search).has('play')) {
  document.documentElement.classList.add('play');
  let chars = 0, last = 0;
  const say = el => {
    for (const n of [...el.childNodes]) {
      if (n.nodeType === Node.TEXT_NODE) n.replaceWith(...n.textContent.split(/(\s+)/).filter(Boolean).map(s => {
        chars += s.length;
        if (/^\s/.test(s)) return s;
        const w = document.createElement('span');
        last = 300 + (chars - s.length) * 13;
        w.className = 'w'; w.textContent = s; w.style.setProperty('--d', last + 'ms');
        return w;
      }));
      else if (n.tagName === 'I') { n.classList.add('w'); n.style.setProperty('--d', last + 'ms'); chars += n.textContent.length; }
      else if (n.tagName === 'EM') { say(n); n.style.setProperty('--d', last + 500 + 'ms'); }
      else chars++;
    }
  };
  say(document.querySelector('h1'));
  document.querySelector('.btn').style.setProperty('--d', last + 1100 + 'ms');
}
</script>
</body>
</html>
